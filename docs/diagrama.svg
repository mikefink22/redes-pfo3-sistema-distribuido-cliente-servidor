<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" width="1000" height="960" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="960" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Sistema distribuido de tareas (cliente-servidor)</text>

  <!-- Capas -->
  <text x="40" y="78" font-size="13" font-weight="bold" fill="#6b7280">CLIENTES</text>
  <text x="40" y="208" font-size="13" font-weight="bold" fill="#6b7280">ENTRADA</text>
  <text x="40" y="338" font-size="13" font-weight="bold" fill="#6b7280">DESPACHO</text>
  <text x="40" y="478" font-size="13" font-weight="bold" fill="#6b7280">MENSAJERÍA</text>
  <text x="40" y="608" font-size="13" font-weight="bold" fill="#6b7280">PROCESAMIENTO</text>
  <text x="40" y="788" font-size="13" font-weight="bold" fill="#6b7280">ALMACENAMIENTO</text>

  <!-- Clientes -->
  <g stroke-width="2">
    <rect x="130" y="90" width="220" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-dasharray="7 4"/>
    <rect x="390" y="90" width="220" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-dasharray="7 4"/>
    <rect x="650" y="90" width="220" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  </g>
  <g text-anchor="middle" fill="#111827">
    <text x="240" y="118" font-size="16" font-weight="bold">Cliente móvil</text>
    <text x="240" y="138" font-size="12" fill="#4b5563">app Android / iOS</text>
    <text x="500" y="118" font-size="16" font-weight="bold">Cliente web</text>
    <text x="500" y="138" font-size="12" fill="#4b5563">navegador</text>
    <text x="760" y="118" font-size="16" font-weight="bold">Cliente CLI (Python)</text>
    <text x="760" y="138" font-size="12" fill="#4b5563">cliente.py · sockets TCP</text>
  </g>

  <!-- Flechas clientes -> balanceador -->
  <g stroke="#374151" stroke-width="2" fill="none" marker-end="url(#flecha)" marker-start="url(#flecha)">
    <line x1="240" y1="154" x2="330" y2="216"/>
    <line x1="500" y1="154" x2="500" y2="216"/>
    <line x1="760" y1="154" x2="670" y2="216"/>
  </g>
  <text x="512" y="190" font-size="12" fill="#374151">TCP · JSON</text>

  <!-- Balanceador -->
  <rect x="250" y="220" width="500" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="500" y="248" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Balanceador de carga</text>
  <text x="500" y="268" text-anchor="middle" font-size="12" fill="#4b5563">Nginx / HAProxy · reparte conexiones entre servidores (TCP, capa 4)</text>

  <!-- Balanceador -> servidores -->
  <g stroke="#374151" stroke-width="2" fill="none" marker-end="url(#flecha)" marker-start="url(#flecha)">
    <line x1="400" y1="284" x2="320" y2="354"/>
    <line x1="600" y1="284" x2="680" y2="354"/>
  </g>

  <!-- Servidores de despacho -->
  <g stroke-width="2" fill="#dbeafe" stroke="#2563eb">
    <rect x="130" y="358" width="380" height="84" rx="8"/>
    <rect x="530" y="358" width="340" height="84" rx="8" stroke-dasharray="7 4" fill="#eff6ff"/>
  </g>
  <g text-anchor="middle" fill="#111827">
    <text x="320" y="386" font-size="16" font-weight="bold">Servidor de despacho 1</text>
    <text x="320" y="406" font-size="12" fill="#4b5563">servidor.py · recibe tareas por socket,</text>
    <text x="320" y="422" font-size="12" fill="#4b5563">elige el worker menos cargado y devuelve el resultado</text>
    <text x="700" y="386" font-size="16" font-weight="bold">Servidor de despacho N</text>
    <text x="700" y="406" font-size="12" fill="#4b5563">réplica del mismo servidor</text>
    <text x="700" y="422" font-size="12" fill="#4b5563">(escala horizontal)</text>
  </g>

  <!-- Servidores -> RabbitMQ -->
  <g stroke="#374151" stroke-width="2" fill="none" marker-end="url(#flecha)" marker-start="url(#flecha)">
    <line x1="320" y1="442" x2="380" y2="496"/>
    <line x1="700" y1="442" x2="620" y2="496"/>
  </g>

  <!-- RabbitMQ -->
  <rect x="250" y="500" width="500" height="76" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="500" y="528" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Cola de mensajes — RabbitMQ</text>
  <text x="500" y="548" text-anchor="middle" font-size="12" fill="#4b5563">cola de tareas · cola de resultados · comunicación entre servidores</text>
  <text x="500" y="565" text-anchor="middle" font-size="11" fill="#6b7280">(en el prototipo, el socket servidor ↔ worker cumple este rol)</text>

  <!-- RabbitMQ -> workers -->
  <g stroke="#374151" stroke-width="2" fill="none" marker-end="url(#flecha)" marker-start="url(#flecha)">
    <line x1="400" y1="576" x2="240" y2="626"/>
    <line x1="500" y1="576" x2="500" y2="626"/>
    <line x1="600" y1="576" x2="760" y2="626"/>
  </g>

  <!-- Workers -->
  <g stroke-width="2" fill="#dbeafe" stroke="#2563eb">
    <rect x="120" y="630" width="240" height="120" rx="8"/>
    <rect x="380" y="630" width="240" height="120" rx="8"/>
    <rect x="640" y="630" width="240" height="120" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#111827" font-size="16" font-weight="bold">
    <text x="240" y="656">Worker 1</text>
    <text x="500" y="656">Worker 2</text>
    <text x="760" y="656">Worker N</text>
  </g>
  <g text-anchor="middle" fill="#4b5563" font-size="12">
    <text x="240" y="674">worker.py · pool de hilos</text>
    <text x="500" y="674">worker.py · pool de hilos</text>
    <text x="760" y="674">worker.py · pool de hilos</text>
  </g>
  <!-- hilos -->
  <g fill="#ffffff" stroke="#2563eb" stroke-width="1.5">
    <rect x="150" y="694" width="38" height="38" rx="4"/><rect x="198" y="694" width="38" height="38" rx="4"/><rect x="246" y="694" width="38" height="38" rx="4"/><rect x="294" y="694" width="38" height="38" rx="4"/>
    <rect x="410" y="694" width="38" height="38" rx="4"/><rect x="458" y="694" width="38" height="38" rx="4"/><rect x="506" y="694" width="38" height="38" rx="4"/><rect x="554" y="694" width="38" height="38" rx="4"/>
    <rect x="670" y="694" width="38" height="38" rx="4"/><rect x="718" y="694" width="38" height="38" rx="4"/><rect x="766" y="694" width="38" height="38" rx="4"/><rect x="814" y="694" width="38" height="38" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="bold">
    <text x="169" y="718">H1</text><text x="217" y="718">H2</text><text x="265" y="718">H3</text><text x="313" y="718">H4</text>
    <text x="429" y="718">H1</text><text x="477" y="718">H2</text><text x="525" y="718">H3</text><text x="573" y="718">H4</text>
    <text x="689" y="718">H1</text><text x="737" y="718">H2</text><text x="785" y="718">H3</text><text x="833" y="718">H4</text>
  </g>

  <!-- Workers -> almacenamiento (bus) -->
  <g stroke="#374151" stroke-width="2" fill="none">
    <line x1="240" y1="750" x2="240" y2="772"/>
    <line x1="500" y1="750" x2="500" y2="772"/>
    <line x1="760" y1="750" x2="760" y2="772"/>
    <line x1="240" y1="772" x2="760" y2="772"/>
  </g>
  <g stroke="#374151" stroke-width="2" fill="none" marker-end="url(#flecha)">
    <line x1="350" y1="772" x2="350" y2="806"/>
    <line x1="650" y1="772" x2="650" y2="806"/>
  </g>

  <!-- Almacenamiento -->
  <g stroke-width="2" fill="#f3f4f6" stroke="#6b7280" stroke-dasharray="7 4">
    <rect x="190" y="810" width="320" height="70" rx="8"/>
    <rect x="530" y="810" width="320" height="70" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#111827">
    <text x="350" y="838" font-size="16" font-weight="bold">PostgreSQL</text>
    <text x="350" y="858" font-size="12" fill="#4b5563">estado de tareas y usuarios (relacional)</text>
    <text x="690" y="838" font-size="16" font-weight="bold">Amazon S3</text>
    <text x="690" y="858" font-size="12" fill="#4b5563">archivos grandes y resultados (objetos)</text>
  </g>

  <!-- Leyenda -->
  <rect x="40" y="906" width="22" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="919" font-size="12" fill="#111827">Implementado en Python (cliente, servidor de despacho, workers con pool de hilos)</text>
  <rect x="560" y="906" width="22" height="16" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="590" y="919" font-size="12" fill="#111827">Solo en el diseño (componentes de infraestructura)</text>
  <text x="40" y="944" font-size="12" fill="#4b5563">Las flechas dobles indican tareas hacia los workers y resultados de vuelta al cliente.</text>
</svg>
